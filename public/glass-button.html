<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glass Button</title>
    <style>
      :root {
        --glass-bg: rgba(255, 255, 255, 0.18);
        --glass-bg-hover: rgba(255, 255, 255, 0.28);
        --glass-bg-active: rgba(255, 255, 255, 0.14);
        --glass-border: rgba(255, 255, 255, 0.35);
        --glass-border-hover: rgba(255, 255, 255, 0.55);
        --glass-text: #0f172a;
        --glass-text-shadow: 0 1px 1px rgba(255, 255, 255, 0.4);
        --glass-shadow:
          0 8px 24px rgba(15, 23, 42, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.55);
        --glass-shadow-hover:
          0 14px 32px rgba(15, 23, 42, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.7);
        --glass-shadow-active:
          0 4px 10px rgba(15, 23, 42, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
        --glass-radius: 14px;
      }

      [data-theme='dark'] {
        --glass-bg: rgba(255, 255, 255, 0.08);
        --glass-bg-hover: rgba(255, 255, 255, 0.16);
        --glass-bg-active: rgba(255, 255, 255, 0.06);
        --glass-border: rgba(255, 255, 255, 0.18);
        --glass-border-hover: rgba(255, 255, 255, 0.35);
        --glass-text: #f8fafc;
        --glass-text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
        --glass-shadow:
          0 8px 24px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.18);
        --glass-shadow-hover:
          0 14px 32px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.28);
        --glass-shadow-active:
          0 4px 10px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }

      body {
        display: grid;
        place-items: center;
        gap: 18px;
        font-family: 'Inter', system-ui, sans-serif;
        background:
          radial-gradient(at 20% 20%, #ff8a65 0%, transparent 55%),
          radial-gradient(at 80% 30%, #7c4dff 0%, transparent 55%),
          radial-gradient(at 50% 90%, #26c6da 0%, transparent 55%),
          linear-gradient(135deg, #0f2027 0%, #2c5364 100%);
      }

      .stage {
        display: flex;
        flex-direction: column;
        gap: 18px;
        align-items: center;
      }

      /* ===== Glass button ===== */
      .glass-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 14px 26px;
        font: 600 16px/1 'Inter', system-ui, sans-serif;
        color: var(--glass-text);
        text-shadow: var(--glass-text-shadow);
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: var(--glass-radius);
        backdrop-filter: blur(14px) saturate(160%);
        -webkit-backdrop-filter: blur(14px) saturate(160%);
        box-shadow: var(--glass-shadow);
        cursor: pointer;
        overflow: hidden;
        transition:
          background-color 0.3s ease,
          border-color 0.3s ease,
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      /* Light-reflection gradient overlay */
      .glass-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.35) 0%,
          rgba(255, 255, 255, 0) 45%,
          rgba(255, 255, 255, 0) 100%
        );
        pointer-events: none;
        opacity: 0.9;
        transition: opacity 0.3s ease;
      }

      .glass-btn > * { position: relative; z-index: 1; }

      .glass-btn:hover {
        background: var(--glass-bg-hover);
        border-color: var(--glass-border-hover);
        transform: translateY(-2px);
        box-shadow: var(--glass-shadow-hover);
      }

      .glass-btn:hover::before { opacity: 1; }

      .glass-btn:active {
        background: var(--glass-bg-active);
        transform: translateY(0);
        box-shadow: var(--glass-shadow-active);
      }

      .glass-btn:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.7);
        outline-offset: 3px;
      }

      .glass-btn .icon {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
      }

      /* Theme toggle button (top right) */
      .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <button class="glass-btn" type="button">Get started</button>

      <button class="glass-btn" type="button">
        <svg
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12h14" />
          <path d="m12 5 7 7-7 7" />
        </svg>
        Continue
      </button>
    </div>

    <button
      class="glass-btn theme-toggle"
      type="button"
      onclick="document.documentElement.dataset.theme =
        document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'"
    >
      Toggle theme
    </button>
  </body>
</html>
